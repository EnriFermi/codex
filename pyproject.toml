[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-prism"
version = "0.1.0"
description = "A customizable terminal workbench for Codex with readable, inspectable execution traces"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["textual>=8.2.8,<9", "rich>=14.3,<15", "pygments>=2.18,<3", "pylatexenc>=2.11,<3", "mdit-py-plugins>=0.6,<0.7"]

[project.scripts]
codex-prism = "codex_prism.cli:main"

[dependency-groups]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.25,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.hatch.build.targets.wheel]
packages = ["src/codex_prism"]
